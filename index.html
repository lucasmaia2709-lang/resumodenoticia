<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resumidor de Notícias</title>
    <!-- Carrega o Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Carrega a fonte Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Define a fonte Inter como padrão */
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Animação de rotação para o spinner */
        .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            border-left-color: #4f46e5;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white w-full max-w-2xl p-6 md:p-8 rounded-lg shadow-lg">
        
        <!-- Título e Descrição -->
        <div class="text-center">
            <h1 class="text-2xl md:text-3xl font-bold text-gray-800">Resumidor de Notícias</h1>
            <p class="text-gray-600 mt-2">Cole o link de uma notícia e obtenha um resumo instantâneo.</p>
        </div>

        <!-- Formulário de Entrada -->
        <div class="mt-6">
            <label for="url-input" class="block text-sm font-medium text-gray-700 mb-2">Link da Notícia</label>
            <div class="flex flex-col sm:flex-row gap-3">
                <input type="url" id="url-input" placeholder="https://www.exemplo.com/noticia..." class="flex-grow w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition">
                <button id="summarize-button" class="flex justify-center items-center bg-indigo-600 text-white px-5 py-2 rounded-lg font-semibold shadow-md hover:bg-indigo-700 transition duration-200 ease-in-out disabled:opacity-50 disabled:cursor-not-allowed">
                    <span id="button-text">Resumir</span>
                    <div id="loading-spinner" class="spinner hidden ml-2"></div>
                </button>
            </div>
        </div>

        <!-- Mensagem de Erro -->
        <div id="error-message" class="hidden mt-4 p-3 bg-red-100 text-red-700 rounded-lg text-center">
            <!-- Mensagens de erro aparecerão aqui -->
        </div>

        <!-- Container de Saída -->
        <div id="output-container" class="hidden mt-6 border-t border-gray-200 pt-6">
            <h2 class="text-xl font-semibold text-gray-800 mb-3">Resumo Gerado</h2>
            <!-- Texto do Resumo -->
            <div id="summary-text" class="text-gray-700 bg-gray-50 p-4 rounded-lg whitespace-pre-wrap leading-relaxed">
                <!-- O resumo gerado aparecerá aqui -->
            </div>
            
            <!-- Botões de Vies -->
            <div id="bias-controls" class="mt-4 flex flex-wrap gap-3 items-center">
                <button id="critique-button" class="flex-1 sm:flex-auto bg-red-500 text-white px-4 py-2 rounded-lg font-medium hover:bg-red-600 transition disabled:opacity-50">
                    Gerar Crítica
                </button>
                <button id="favor-button" class="flex-1 sm:flex-auto bg-green-500 text-white px-4 py-2 rounded-lg font-medium hover:bg-green-600 transition disabled:opacity-50">
                    Gerar Favorecimento
                </button>
                <button id="reset-button" class="flex-1 sm:flex-auto bg-gray-400 text-white px-4 py-2 rounded-lg font-medium hover:bg-gray-500 transition disabled:opacity-50" disabled>
                    Resumo Neutro
                </button>
                <div id="bias-loading-spinner" class="spinner hidden ml-2"></div>
            </div>

            <!-- Informação da Fonte -->
            <div class="mt-4 border-t border-gray-100 pt-4">
                <h3 class="text-sm font-medium text-gray-600">Fonte Detectada:</h3>
                <a id="source-link" href="#" target="_blank" rel="noopener noreferrer" class="text-indigo-600 hover:text-indigo-800 truncate block text-sm">
                    <!-- O título e link da fonte aparecerão aqui -->
                </a>
            </div>
        </div>

    </div>

    <script type="module">
        // Referências dos elementos da DOM
        const urlInput = document.getElementById('url-input');
        const summarizeButton = document.getElementById('summarize-button');
        const buttonText = document.getElementById('button-text');
        const loadingSpinner = document.getElementById('loading-spinner');
        const errorMessage = document.getElementById('error-message');
        const outputContainer = document.getElementById('output-container');
        const summaryText = document.getElementById('summary-text');
        const sourceLink = document.getElementById('source-link');
        
        // Novos elementos
        const critiqueButton = document.getElementById('critique-button');
        const favorButton = document.getElementById('favor-button');
        const resetButton = document.getElementById('reset-button');
        const biasLoadingSpinner = document.getElementById('bias-loading-spinner');

        // Chave da API (deixe em branco, será fornecida pelo ambiente)
        const apiKey = "AIzaSyBo90fWoREhClB8W3fuI4mD8_eEDrPYrKo";
        const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;

        // Armazena o resumo neutro original
        let originalSummaryText = "";

        // Adiciona o listener de clique ao botão
        summarizeButton.addEventListener('click', handleSummarize);
        
        // Permite pressionar "Enter" no input
        urlInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                handleSummarize();
            }
        });

        // Listeners para os novos botões
        critiqueButton.addEventListener('click', () => handleBias('critique'));
        favorButton.addEventListener('click', () => handleBias('favor'));
        resetButton.addEventListener('click', resetSummary);


        /**
         * Função principal para lidar com o processo de resumo
         */
        async function handleSummarize() {
            const url = urlInput.value.trim();
            originalSummaryText = ""; // Reseta o resumo em cada nova solicitação

            // Validação simples da URL
            if (!url || !isValidHttpUrl(url)) {
                showError("Por favor, insira um link válido (ex: https://...).");
                return;
            }

            // Reseta a interface e mostra o loading
            showLoading(true);
            hideError();
            outputContainer.classList.add('hidden');

            // Instrução do sistema para a IA
            const systemPrompt = "Você é um assistente de resumo. Sua tarefa é fornecer um resumo conciso, informativo e bem escrito do conteúdo encontrado na URL fornecida pelo usuário. Responda em português.";
            const userQuery = `Por favor, resuma o conteúdo da seguinte URL: ${url}`;
            
            const payload = {
                contents: [{ parts: [{ text: userQuery }] }],
                tools: [{ "google_search": {} }], // Habilita a busca no Google
                systemInstruction: {
                    parts: [{ text: systemPrompt }]
                },
            };

            try {
                // Implementa retry com backoff exponencial
                const response = await fetchWithRetry(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    const errorBody = await response.json();
                    console.error("Erro da API:", errorBody);
                    throw new Error(errorBody.error?.message || `Erro ${response.status}: Falha na solicitação`);
                }

                const result = await response.json();
                
                // Processa a resposta da API
                const candidate = result.candidates?.[0];
                const text = candidate?.content?.parts?.[0]?.text;
                const metadata = candidate?.groundingMetadata;
                const source = metadata?.groundingAttributions?.[0]?.web;

                if (text) {
                    // Exibe o resumo e a fonte
                    originalSummaryText = text; // Armazena o resumo neutro
                    summaryText.textContent = text;
                    
                    if (source?.uri) {
                        sourceLink.href = source.uri;
                        sourceLink.textContent = source.title || source.uri;
                        sourceLink.parentElement.classList.remove('hidden');
                    } else {
                        sourceLink.parentElement.classList.add('hidden');
                    }
                    outputContainer.classList.remove('hidden');
                    resetButton.disabled = true; // Já está neutro
                    critiqueButton.disabled = false;
                    favorButton.disabled = false;

                } else {
                    // Caso não consiga resumir
                    console.warn("Resposta da API sem texto:", result);
                    showError("Não foi possível gerar um resumo. A API pode não ter conseguido acessar ou processar o conteúdo do link.");
                }

            } catch (error) {
                console.error("Erro no processo de resumo:", error);
                showError(`Ocorreu um erro: ${error.message}`);
            } finally {
                // Para o loading
                showLoading(false);
            }
        }

        /**
         * Gera um texto enviesado (crítica ou favorecimento)
         */
        async function handleBias(biasType) {
            if (!originalSummaryText) return; // Checagem de segurança

            setBiasLoading(true);
            hideError();

            let systemPrompt = "";
            if (biasType === 'critique') {
                systemPrompt = "Você é um analista crítico e cético. Sua tarefa é reescrever o texto fornecido para focar exclusivamente nos aspectos negativos, riscos, falhas e dar uma perspectiva pessimista. Não seja neutro. Responda em português.";
            } else if (biasType === 'favor') {
                systemPrompt = "Você é um assessor de imprensa entusiasmado. Sua tarefa é reescrever o texto fornecido para focar exclusivamente nos aspectos positivos, oportunidades e dar uma perspectiva otimista. Ignore quaisquer pontos negativos. Responda em português.";
            }

            const userQuery = `Reescreva o seguinte resumo, aplicando o viés solicitado:\n\n--- INÍCIO DO RESUMO ---\n${originalSummaryText}\n--- FIM DO RESUMO ---`;

            // Payload SEM google_search, pois estamos apenas transformando texto
            const payload = {
                contents: [{ parts: [{ text: userQuery }] }],
                systemInstruction: {
                    parts: [{ text: systemPrompt }]
                },
            };

            try {
                const response = await fetchWithRetry(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    const errorBody = await response.json();
                    throw new Error(errorBody.error?.message || `Erro ${response.status}`);
                }

                const result = await response.json();
                const candidate = result.candidates?.[0];
                const text = candidate?.content?.parts?.[0]?.text;

                if (text) {
                    summaryText.textContent = text; // Atualiza o texto do resumo
                    resetButton.disabled = false; // Habilita o botão de reset
                } else {
                    showError("Não foi possível gerar o texto enviesado.");
                }

            } catch (error) {
                console.error("Erro ao gerar viés:", error);
                showError(`Ocorreu um erro: ${error.message}`);
            } finally {
                setBiasLoading(false);
            }
        }

        /**
         * Reseta o resumo para a versão neutra original
         */
        function resetSummary() {
            summaryText.textContent = originalSummaryText;
            resetButton.disabled = true;
            critiqueButton.disabled = false;
            favorButton.disabled = false;
            hideError();
        }


        /**
         * Fetch com lógica de retry e backoff exponencial
         */
        async function fetchWithRetry(url, options, retries = 3, backoff = 1000) {
            for (let i = 0; i < retries; i++) {
                try {
                    const res = await fetch(url, options);
                    // Erros 5xx são candidatos para retry
                    if (res.status >= 500 && res.status < 600) {
                        throw new Error(`Erro de servidor: ${res.status}`);
                    }
                    return res; // Sucesso (incluindo erros 4xx que não devem ser retentados)
                } catch (err) {
                    if (i === retries - 1) throw err; // Joga o erro na última tentativa
                    await new Promise(resolve => setTimeout(resolve, backoff * Math.pow(2, i)));
                }
            }
        }

        /**
         * Funções auxiliares da UI
         */
        function showLoading(isLoading) {
            if (isLoading) {
                summarizeButton.disabled = true;
                buttonText.textContent = "Resumindo...";
                loadingSpinner.classList.remove('hidden');
                // Desabilita todos os botões de ação
                critiqueButton.disabled = true;
                favorButton.disabled = true;
                resetButton.disabled = true;
            } else {
                summarizeButton.disabled = false;
                buttonText.textContent = "Resumir";
                loadingSpinner.classList.add('hidden');
                // Os botões de viés serão re-habilitados seletivamente pela lógica principal
            }
        }
        
        function setBiasLoading(isLoading) {
            if (isLoading) {
                biasLoadingSpinner.classList.remove('hidden');
                critiqueButton.disabled = true;
                favorButton.disabled = true;
                resetButton.disabled = true;
            } else {
                biasLoadingSpinner.classList.add('hidden');
                critiqueButton.disabled = false;
                favorButton.disabled = false;
                // O estado do botão de reset depende se o texto atual é o original
                resetButton.disabled = (summaryText.textContent === originalSummaryText);
            }
        }

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.remove('hidden');
        }

        function hideError() {
            errorMessage.classList.add('hidden');
        }

        function isValidHttpUrl(string) {
            let url;
            try {
                url = new URL(string);
            } catch (_) {
                return false;
            }
            return url.protocol === "http:" || url.protocol === "https:";
        }

    </script>
</body>
</html>
